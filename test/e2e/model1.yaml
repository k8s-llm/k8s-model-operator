apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-store2
spec:
  capacity:
    storage: 4Gi
  accessModes:
  - ReadWriteOnce
  - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc2
spec:
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
  resources:
    requests:
      storage: 4Gi
  storageClassName: ""
  volumeName: models-store2
---
apiVersion: llmmodel.host-llm.io/v1alpha1
kind: Model
metadata:
  name: model-sample
spec:
  provider: Ollama
  llmModel:
    name: qwen3
    version: 0.6b
  maxReplicas: 2
  minReplicas: 1
  targetNamespace: test-models
  persistentVolumeClaimRef: models-pvc2
  mountPath: /data/models
  modelPath: qwen3-0.0b

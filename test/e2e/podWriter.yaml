apiVersion: v1
kind: Pod
metadata:
  labels:
    app: volume-directory-creator
  name: volume-directory-creator
  namespace: test-models
spec:
  containers:
    #- command:
    #  - /bin/sh
    #  - -c
    #args:
    #  - ollama serve
    #  - ollama pull qwen3:0.6b
      #      - mkdir -p /data/models/qwen3-0.6b 
  - env:
      - name: OLLAMA_MODELS
        value: /data/models/qwen3-0.6b
    image: ollama/ollama
    imagePullPolicy: IfNotPresent
    restartPolicy: Never
    name: app
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /data/models
      name: models-ro
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-hmzzs
      readOnly: true
  volumes:
  - name: models-ro
    persistentVolumeClaim:
      claimName: models-pvc2
      readOnly: false
  - name: kube-api-access-hmzzs
    projected:
      defaultMode: 420
      sources:
      - serviceAccountToken:
          expirationSeconds: 3607
          path: token
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: kube-root-ca.crt
      - downwardAPI:
          items:
          - fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
            path: namespace

